<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        /* Tipografía: Poppins (títulos) + Inter (texto) */
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap");

        /* =========================================================
           Tema general (Estudiante B - feature-theme-update)
           ========================================================= */

        /* ===== Esquema de colores y tipografía ===== */
        :root {
            --color-bg-1: #0f2027;
            --color-bg-2: #203a43;
            --color-bg-3: #2c5364;
            --color-primary: #14b8a6;       /* turquesa */
            --color-primary-dark: #0d9488;
            --color-accent: #f59e0b;        /* ámbar para el resultado */
            --color-text: #1e293b;
            --color-muted: #64748b;
            --color-card: rgba(255, 255, 255, 0.96);
            --color-border: #e2e8f0;

            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-title: 'Poppins', var(--font-body);
        }

        /* ===== Base ===== */
        body {
            font-family: var(--font-body);
            color: var(--color-text);
            background: linear-gradient(135deg, var(--color-bg-1), var(--color-bg-2), var(--color-bg-3));
            background-attachment: fixed;
            flex-direction: column;   /* si se añade una navbar, queda arriba y no al lado de la tarjeta */
            padding: 1rem;
        }

        /* Sustituye a la altura fija de .vh-100: en pantallas bajas el contenido no se corta */
        body.vh-100 {
            height: auto !important;
            min-height: 100vh;
        }

        /* Una navbar colocada directamente en <body> ocupa todo el ancho */
        body > nav,
        body > header,
        body > .navbar {
            align-self: stretch;
        }

        /* ===== Tarjeta ===== */
        .converter-card {
            width: 100% !important;   /* anula el width: 400px del atributo style */
            max-width: 420px;
            margin: auto;
            border: none;
            border-radius: 20px;
            background: var(--color-card);
        }

        .converter-card h2 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(1.4rem, 5vw, 1.9rem);
            color: var(--color-bg-2);
        }

        /* ===== Formulario ===== */
        .converter-card .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--color-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .converter-card .form-control,
        .converter-card .form-select {
            border: 2px solid var(--color-border);
            border-radius: 12px;
        }

        .converter-card .form-control:focus,
        .converter-card .form-select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 0.2rem rgba(20, 184, 166, 0.25);
        }

        /* Flecha entre los dos selectores */
        .converter-card form .row > .text-center {
            flex: 0 0 auto;
            width: auto;
            font-size: 1.5rem;
            color: var(--color-primary);
        }

        /* ===== Botón ===== */
        .converter-card .btn-primary {
            font-family: var(--font-title);
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: var(--color-primary);
            transition: background 0.2s, transform 0.1s;
        }

        .converter-card .btn-primary:hover,
        .converter-card .btn-primary:focus {
            background: var(--color-primary-dark);
        }

        .converter-card .btn-primary:active {
            transform: scale(0.98);
        }

        /* ===== Resultado ===== */
        .result-box {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-accent);
            background: rgba(245, 158, 11, 0.1);
            border-radius: 12px;
            padding: 0.75rem;
            word-break: break-word;
        }

        /* ===== Responsive ===== */
        @media (max-width: 576px) {
            .converter-card {
                padding: 1.5rem !important;
            }

            /* Selectores apilados y flecha hacia abajo */
            .converter-card form .row {
                flex-direction: column;
                gap: 0.5rem;
            }

            .converter-card form .row > .text-center {
                transform: rotate(90deg);
                align-self: center !important;
            }

            .result-box {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-md site-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <svg class="brand-logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo de DivisaFácil">
                    <rect width="40" height="40" rx="10" fill="#f2c14e"/>
                    <path d="M10 15h16m0 0-4-4m4 4-4 4" fill="none" stroke="#14284f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M30 25H14m0 0 4-4m-4 4 4 4" fill="none" stroke="#14284f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                DivisaFácil
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" aria-controls="mainNav"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-md-auto gap-md-1">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Convertir</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Divisas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Historial</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Acerca de</a></li>
                </ul>
                <a href="#" class="btn btn-outline-light nav-cta mt-2 mt-md-0">Iniciar sesión</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="flex-grow-1 d-flex justify-content-center align-items-center p-3">
        <div class="card shadow-lg p-4 converter-card">
            <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" step="0.01" name="amount"
                           class="form-control form-control-lg"
                           placeholder="Introduce cantidad" required>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <select name="from_currency" class="form-select">
                            <option value="EUR">EUR €</option>
                            <option value="USD">USD $</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                    <div class="col text-center align-self-center">
                        →
                    </div>
                    <div class="col">
                        <select name="to_currency" class="form-select">
                            <option value="USD">USD $</option>
                            <option value="EUR">EUR €</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Convertir
                    </button>
                </div>
            </form>

            {% if result is not none %}
                <div class="mt-4 text-center result-box">
                    {{ result }}
                </div>
            {% endif %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
