<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: "DM Sans", system-ui, sans-serif;
        }

        /* ---------- Navbar ---------- */
        .site-navbar {
            background: rgba(10, 25, 55, 0.55);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-block: 0.75rem;
        }
        .site-navbar .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-family: "DM Serif Display", Georgia, serif;
            font-size: 1.5rem;
            color: #fff;
        }
        .site-navbar .navbar-brand:hover {
            color: #f2c14e;
        }
        .brand-logo {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
        }
        .site-navbar .nav-link {
            color: rgba(255, 255, 255, 0.78);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            transition: background-color 0.2s, color 0.2s;
        }
        .site-navbar .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .site-navbar .nav-link.active {
            color: #14284f;
            background: #f2c14e;
        }
        .site-navbar .nav-link:focus-visible,
        .site-navbar .navbar-brand:focus-visible,
        .site-navbar .navbar-toggler:focus-visible {
            outline: 2px solid #f2c14e;
            outline-offset: 2px;
        }
        .site-navbar .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.4);
        }
        .site-navbar .navbar-toggler-icon {
            filter: invert(1);
        }
        .nav-cta {
            font-weight: 700;
            border-radius: 999px;
            padding-inline: 1.25rem;
        }

        /* ---------- Tarjeta del conversor ---------- */
        .converter-card {
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            width: 400px;
            max-width: 100%;
        }
        .result-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #198754;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-md site-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <svg class="brand-logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo de DivisaFácil">
                    <rect width="40" height="40" rx="10" fill="#f2c14e"/>
                    <path d="M10 15h16m0 0-4-4m4 4-4 4" fill="none" stroke="#14284f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M30 25H14m0 0 4-4m-4 4 4 4" fill="none" stroke="#14284f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                DivisaFácil
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" aria-controls="mainNav"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-md-auto gap-md-1">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Convertir</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Divisas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Historial</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Acerca de</a></li>
                </ul>
                <a href="#" class="btn btn-outline-light nav-cta mt-2 mt-md-0">Iniciar sesión</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="flex-grow-1 d-flex justify-content-center align-items-center p-3">
        <div class="card shadow-lg p-4 converter-card">
            <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" step="0.01" name="amount"
                           class="form-control form-control-lg"
                           placeholder="Introduce cantidad" required>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <select name="from_currency" class="form-select">
                            <option value="EUR">EUR €</option>
                            <option value="USD">USD $</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                    <div class="col text-center align-self-center">
                        →
                    </div>
                    <div class="col">
                        <select name="to_currency" class="form-select">
                            <option value="USD">USD $</option>
                            <option value="EUR">EUR €</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Convertir
                    </button>
                </div>
            </form>

            {% if result is not none %}
                <div class="mt-4 text-center result-box">
                    {{ result }}
                </div>
            {% endif %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
